name: AeroForge UI Screenshot

on:
  push:
    branches: ["feat/aeroforge-foundation"]
    paths:
      - ".github/workflows/aeroforge-ui-screenshot.yml"
      - "crates/app/src/main.rs"
      - "crates/app/src/ui_evidence.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WGPU_SETTINGS_PRIO: webgl2

jobs:
  screenshot:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build AeroForge desktop app
        run: cargo build -p aeroforge-app
      - name: Launch AeroForge and capture Bevy primary render target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing

          $exe = (Resolve-Path ".\target\debug\aeroforge-app.exe").Path
          $capturePath = Join-Path $PWD "aeroforge-bevy-primary.png"
          $stdout = Join-Path $PWD "aeroforge-stdout.log"
          $stderr = Join-Path $PWD "aeroforge-stderr.log"
          $env:AEROFORGE_UI_EVIDENCE_PATH = $capturePath
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
              $ready = $false
              for ($attempt = 1; $attempt -le 40; $attempt++) {
                  Start-Sleep -Seconds 1
                  $process.Refresh()
                  if ($process.HasExited) {
                      throw "AeroForge exited before Bevy wrote the primary-window screenshot. Exit code: $($process.ExitCode)"
                  }
                  if (Test-Path $capturePath) {
                      $file = Get-Item $capturePath
                      if ($file.Length -gt 0) {
                          $ready = $true
                          break
                      }
                  }
              }
              if (-not $ready) {
                  throw "Bevy did not write the requested primary-window screenshot within 40 seconds."
              }

              # Make sure save_to_disk has released a complete decodable PNG before validating it.
              $bitmap = $null
              for ($attempt = 1; $attempt -le 5; $attempt++) {
                  try {
                      $bitmap = [System.Drawing.Bitmap]::new($capturePath)
                      break
                  } catch {
                      Start-Sleep -Milliseconds 500
                  }
              }
              if ($null -eq $bitmap) {
                  throw "Bevy screenshot exists but could not be decoded as a complete image."
              }

              try {
                  $width = $bitmap.Width
                  $height = $bitmap.Height
                  if ($width -lt 800 -or $height -lt 450) {
                      throw "Bevy screenshot dimensions are unexpectedly small: ${width}x${height}."
                  }

                  $stepX = [Math]::Max(1, [int][Math]::Floor($width / 128.0))
                  $stepY = [Math]::Max(1, [int][Math]::Floor($height / 72.0))
                  $nonDark = 0
                  $sampleCount = 0
                  $minLuma = 255
                  $maxLuma = 0
                  for ($y = 0; $y -lt $height; $y += $stepY) {
                      for ($x = 0; $x -lt $width; $x += $stepX) {
                          $pixel = $bitmap.GetPixel($x, $y)
                          $luma = [int](($pixel.R + $pixel.G + $pixel.B) / 3)
                          $sampleCount++
                          if ($luma -gt 24) { $nonDark++ }
                          if ($luma -lt $minLuma) { $minLuma = $luma }
                          if ($luma -gt $maxLuma) { $maxLuma = $luma }
                      }
                  }
                  $lumaSpan = $maxLuma - $minLuma
                  if ($nonDark -lt 32 -or $lumaSpan -lt 20) {
                      throw "Bevy primary-window screenshot is effectively blank: non-dark=$nonDark/$sampleCount luma-span=$lumaSpan"
                  }
              } finally {
                  $bitmap.Dispose()
              }

              $file = Get-Item $capturePath
              $hash = (Get-FileHash $capturePath -Algorithm SHA256).Hash
              "Captured Bevy primary render target ${width}x${height}; bytes=$($file.Length); sha256=$hash; non-dark=$nonDark/$sampleCount; luma-span=$lumaSpan" | Set-Content -Path "aeroforge-capture.txt"
              Get-Content "aeroforge-capture.txt"
          } finally {
              Remove-Item Env:AEROFORGE_UI_EVIDENCE_PATH -ErrorAction SilentlyContinue
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
          }
      - name: Upload AeroForge screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeroforge-ui-screenshot
          path: |
            aeroforge-bevy-primary.png
            aeroforge-capture.txt
            aeroforge-stdout.log
            aeroforge-stderr.log
          if-no-files-found: error
          retention-days: 7
