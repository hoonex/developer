name: AeroForge UI Screenshot

on:
  push:
    branches: ["feat/aeroforge-foundation"]
    paths:
      - ".github/workflows/aeroforge-ui-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WGPU_SETTINGS_PRIO: webgl2

jobs:
  screenshot:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Build AeroForge desktop app
        run: cargo build -p aeroforge-app
      - name: Launch AeroForge and capture rendered client
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class AeroForgeCaptureWin32 {
              [StructLayout(LayoutKind.Sequential)]
              public struct RECT { public int Left; public int Top; public int Right; public int Bottom; }
              [StructLayout(LayoutKind.Sequential)]
              public struct POINT { public int X; public int Y; }
              [DllImport("user32.dll")] public static extern bool IsWindow(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll")] public static extern bool GetClientRect(IntPtr hWnd, out RECT rect);
              [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr hWnd, ref POINT point);
              [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);
              [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
              [DllImport("user32.dll")] public static extern bool PrintWindow(IntPtr hWnd, IntPtr hdcBlt, uint nFlags);
          }
          "@

          $exe = (Resolve-Path ".\target\debug\aeroforge-app.exe").Path
          $stdout = Join-Path $PWD "aeroforge-stdout.log"
          $stderr = Join-Path $PWD "aeroforge-stderr.log"
          $process = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          try {
              $handle = [IntPtr]::Zero
              for ($i = 0; $i -lt 30; $i++) {
                  Start-Sleep -Seconds 1
                  $process.Refresh()
                  if ($process.HasExited) {
                      throw "AeroForge exited before a window became available. Exit code: $($process.ExitCode)"
                  }
                  if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
                      $handle = $process.MainWindowHandle
                      break
                  }
              }
              if ($handle -eq [IntPtr]::Zero) {
                  throw "AeroForge did not expose a native window handle within 30 seconds."
              }

              [AeroForgeCaptureWin32]::ShowWindow($handle, 9) | Out-Null
              [AeroForgeCaptureWin32]::SetForegroundWindow($handle) | Out-Null

              $clientPath = Join-Path $PWD "aeroforge-current-client.png"
              $renderReady = $false
              $lastStats = "no client frame sampled"
              $clientWidth = 0
              $clientHeight = 0
              $nonDark = 0
              $sampleCount = 0
              $lumaSpan = 0

              # CPU/software rendering on hosted Windows can need several seconds after HWND
              # creation before the first useful Bevy/egui frame is presented. Bound the wait and
              # reject a merely non-empty all-black bitmap instead of treating it as UI evidence.
              for ($attempt = 1; $attempt -le 15; $attempt++) {
                  Start-Sleep -Seconds 2
                  $process.Refresh()
                  if ($process.HasExited) {
                      throw "AeroForge exited while waiting for a rendered client frame. Exit code: $($process.ExitCode)"
                  }
                  $candidate = $process.MainWindowHandle
                  if ($candidate -eq [IntPtr]::Zero -or -not [AeroForgeCaptureWin32]::IsWindow($candidate)) {
                      $lastStats = "attempt=$attempt native window unavailable"
                      continue
                  }
                  $handle = $candidate

                  $clientRect = [AeroForgeCaptureWin32+RECT]::new()
                  $origin = [AeroForgeCaptureWin32+POINT]::new()
                  if (-not [AeroForgeCaptureWin32]::GetClientRect($handle, [ref]$clientRect) -or
                      -not [AeroForgeCaptureWin32]::ClientToScreen($handle, [ref]$origin)) {
                      $lastStats = "attempt=$attempt client geometry unavailable"
                      continue
                  }
                  $clientWidth = $clientRect.Right - $clientRect.Left
                  $clientHeight = $clientRect.Bottom - $clientRect.Top
                  if ($clientWidth -le 0 -or $clientHeight -le 0) {
                      $lastStats = "attempt=$attempt invalid client ${clientWidth}x${clientHeight}"
                      continue
                  }

                  $bitmap = [System.Drawing.Bitmap]::new($clientWidth, $clientHeight)
                  $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                  try {
                      $graphics.CopyFromScreen($origin.X, $origin.Y, 0, 0, $bitmap.Size)
                      $bitmap.Save($clientPath, [System.Drawing.Imaging.ImageFormat]::Png)

                      $stepX = [Math]::Max(1, [int][Math]::Floor($clientWidth / 96.0))
                      $stepY = [Math]::Max(1, [int][Math]::Floor($clientHeight / 54.0))
                      $minLuma = 255
                      $maxLuma = 0
                      $nonDark = 0
                      $sampleCount = 0
                      for ($y = 0; $y -lt $clientHeight; $y += $stepY) {
                          for ($x = 0; $x -lt $clientWidth; $x += $stepX) {
                              $pixel = $bitmap.GetPixel($x, $y)
                              $luma = [int](($pixel.R + $pixel.G + $pixel.B) / 3)
                              $sampleCount++
                              if ($luma -gt 24) { $nonDark++ }
                              if ($luma -lt $minLuma) { $minLuma = $luma }
                              if ($luma -gt $maxLuma) { $maxLuma = $luma }
                          }
                      }
                      $lumaSpan = $maxLuma - $minLuma
                      $lastStats = "attempt=$attempt client=${clientWidth}x${clientHeight} non-dark=$nonDark/$sampleCount luma-span=$lumaSpan"
                      if ($nonDark -ge 12 -and $lumaSpan -ge 20) {
                          $renderReady = $true
                      }
                  } finally {
                      $graphics.Dispose()
                      $bitmap.Dispose()
                  }
                  if ($renderReady) { break }
              }

              if (-not $renderReady) {
                  throw "AeroForge native client never produced a non-black rendered frame within 30 seconds; $lastStats"
              }

              $rect = [AeroForgeCaptureWin32+RECT]::new()
              if (-not [AeroForgeCaptureWin32]::GetWindowRect($handle, [ref]$rect)) {
                  throw "GetWindowRect failed after rendered-client validation."
              }
              $width = $rect.Right - $rect.Left
              $height = $rect.Bottom - $rect.Top

              $screenPath = Join-Path $PWD "aeroforge-current-screen.png"
              $bitmap = [System.Drawing.Bitmap]::new($width, $height)
              $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
              try {
                  $graphics.CopyFromScreen($rect.Left, $rect.Top, 0, 0, $bitmap.Size)
                  $bitmap.Save($screenPath, [System.Drawing.Imaging.ImageFormat]::Png)
              } finally {
                  $graphics.Dispose()
                  $bitmap.Dispose()
              }

              $printPath = Join-Path $PWD "aeroforge-current-printwindow.png"
              $printBitmap = [System.Drawing.Bitmap]::new($width, $height)
              $printGraphics = [System.Drawing.Graphics]::FromImage($printBitmap)
              try {
                  $hdc = $printGraphics.GetHdc()
                  try {
                      $printed = [AeroForgeCaptureWin32]::PrintWindow($handle, $hdc, 2)
                  } finally {
                      $printGraphics.ReleaseHdc($hdc)
                  }
                  if ($printed) {
                      $printBitmap.Save($printPath, [System.Drawing.Imaging.ImageFormat]::Png)
                  }
              } finally {
                  $printGraphics.Dispose()
                  $printBitmap.Dispose()
              }

              $clientFile = Get-Item $clientPath
              $clientHash = (Get-FileHash $clientPath -Algorithm SHA256).Hash
              "Captured rendered AeroForge client ${clientWidth}x${clientHeight} from handle $handle; client-bytes=$($clientFile.Length); client-sha256=$clientHash; non-dark=$nonDark/$sampleCount; luma-span=$lumaSpan" | Set-Content -Path "aeroforge-capture.txt"
              Get-Content "aeroforge-capture.txt"
          } finally {
              if (-not $process.HasExited) {
                  Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
          }
      - name: Upload AeroForge screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeroforge-ui-screenshot
          path: |
            aeroforge-current-client.png
            aeroforge-current-screen.png
            aeroforge-current-printwindow.png
            aeroforge-capture.txt
            aeroforge-stdout.log
            aeroforge-stderr.log
          if-no-files-found: error
          retention-days: 7
