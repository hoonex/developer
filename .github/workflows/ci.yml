name: AeroForge CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Test numerical, geometry, volume and accurate-backend cores
        run: cargo test -p aeroforge-flow-core -p aeroforge-geometry-core -p aeroforge-volume-core -p aeroforge-accurate-backend -- --nocapture

  su2-generated-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned SU2 8.5.0 runtime
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aeroforge-su2-generated-case"
          PKG="$ROOT/pkg"
          SU2_ROOT="$ROOT/su2"
          mkdir -p "$PKG" "$SU2_ROOT"

          curl -LfsS \
            https://github.com/su2code/SU2/releases/download/v8.5.0/SU2-v8.5.0-linux64-omp.zip \
            -o "$ROOT/su2.zip"
          echo "aadc800cd9df34deff99d4725f5897f620c9f2979f62ab235313311bf501f09b  $ROOT/su2.zip" | sha256sum -c -
          unzip -q "$ROOT/su2.zip" -d "$PKG"

          NESTED_SU2_ZIP="$(find "$PKG" -type f -name 'linux64-omp.zip' -print -quit)"
          if [[ -z "$NESTED_SU2_ZIP" ]]; then
            echo "Nested linux64-omp.zip not found after outer extraction" >&2
            find "$PKG" -maxdepth 3 -printf '%y %p -> %l\n' | head -200 >&2
            exit 1
          fi
          unzip -q "$NESTED_SU2_ZIP" -d "$SU2_ROOT"

          SU2_CFD="$(find "$SU2_ROOT" \( -type f -o -type l \) -name SU2_CFD -print -quit)"
          if [[ -z "$SU2_CFD" ]]; then
            echo "SU2_CFD not found after nested extraction" >&2
            find "$SU2_ROOT" -maxdepth 4 -printf '%y %p -> %l\n' | head -300 >&2
            exit 1
          fi
          SU2_CFD_RESOLVED="$(readlink -f "$SU2_CFD" || true)"
          if [[ -z "$SU2_CFD_RESOLVED" || ! -f "$SU2_CFD_RESOLVED" ]]; then
            echo "SU2_CFD entry did not resolve to a file: $(stat -c '%F %N' "$SU2_CFD")" >&2
            exit 1
          fi
          chmod +x "$SU2_CFD_RESOLVED"
          SU2_BANNER="$($SU2_CFD --help 2>&1 | grep -m1 'SU2 v' || true)"
          if [[ -z "$SU2_BANNER" ]]; then
            echo "SU2_CFD resolved but did not report an SU2 version banner" >&2
            exit 1
          fi
          echo "AEROFORGE_SU2_BANNER=$SU2_BANNER"
          echo "SU2_RUN=$(dirname "$SU2_CFD")" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
      - name: Run AeroForge-generated mesh through SU2
        run: cargo test -p aeroforge-accurate-backend --test su2_generated generated_closed_tunnel_runs_through_su2_850 -- --ignored --nocapture

  app-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check desktop editor and test targets
        run: cargo check -p aeroforge-app --all-targets
      - name: Run desktop editor unit tests
        run: cargo test -p aeroforge-app -- --nocapture

  gpu-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache GPU smoke Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpu-smoke-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-gpu-smoke-cargo-
            ${{ runner.os }}-cargo-
      - name: Validate moving-wall GPU parity
        run: cargo run -p aeroforge-gpu-smoke --bin aeroforge-gpu-smoke
      - name: Validate NEQ open-boundary GPU parity
        run: cargo run -p aeroforge-gpu-smoke --bin open_boundary
      - name: Validate free-stream far-field GPU parity
        run: cargo run -p aeroforge-gpu-smoke --bin far_field
