name: AeroForge CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Test numerical and accurate-backend cores
        run: cargo test -p aeroforge-flow-core -p aeroforge-accurate-backend -- --nocapture

  su2-upstream-one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare pinned SU2 8.5.0 upstream cylinder case
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aeroforge-su2-known-case"
          PKG="$ROOT/pkg"
          CASE="$ROOT/case"
          mkdir -p "$PKG" "$CASE"

          curl -LfsS \
            https://github.com/su2code/SU2/releases/download/v8.5.0/SU2-v8.5.0-linux64-omp.zip \
            -o "$ROOT/su2.zip"
          echo "aadc800cd9df34deff99d4725f5897f620c9f2979f62ab235313311bf501f09b  $ROOT/su2.zip" | sha256sum -c -
          unzip -q "$ROOT/su2.zip" -d "$PKG"

          SU2_CFD="$(find "$PKG" -name SU2_CFD -print -quit)"
          if [[ -z "$SU2_CFD" ]]; then
            echo "SU2_CFD not found after extraction; package entries:" >&2
            find "$PKG" -maxdepth 3 -printf '%y %p -> %l\n' | head -200 >&2
            exit 1
          fi
          chmod +x "$SU2_CFD"
          echo "AEROFORGE_SU2_BINARY_ENTRY=$(stat -c '%F %N' "$SU2_CFD")"

          curl -LfsS \
            https://raw.githubusercontent.com/su2code/SU2/12eb826f049ef7f67df974dfcb44cf36ee07c0f8/TestCases/incomp_navierstokes/cylinder/incomp_cylinder.cfg \
            -o "$CASE/incomp_cylinder.cfg"
          curl -LfsS \
            https://raw.githubusercontent.com/su2code/TestCases/790c80ec5b543487b5f8ecf8bb0f0e4d2cc67f3f/incomp_navierstokes/cylinder/mesh_cylinder_lam.su2 \
            -o "$CASE/mesh_cylinder_lam.su2"

          sed -i -E 's/^ITER=.*$/ITER= 11/' "$CASE/incomp_cylinder.cfg"
          grep -q '^ITER= 11$' "$CASE/incomp_cylinder.cfg"

          echo "SU2_RUN=$(dirname "$SU2_CFD")" >> "$GITHUB_ENV"
          echo "AEROFORGE_SU2_UPSTREAM_CASE_DIR=$CASE" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "AEROFORGE_SU2_CONFIG_COMMIT=12eb826f049ef7f67df974dfcb44cf36ee07c0f8"
          echo "AEROFORGE_SU2_TESTCASES_COMMIT=790c80ec5b543487b5f8ecf8bb0f0e4d2cc67f3f"
      - name: Run AeroForge pinned SU2 upstream regression
        run: cargo test -p aeroforge-accurate-backend --test su2_upstream upstream_inc_laminar_cylinder_matches_su2_850_regression -- --ignored --nocapture

  app-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check desktop editor and test targets
        run: cargo check -p aeroforge-app --all-targets

  gpu-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache GPU smoke Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-gpu-smoke-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-gpu-smoke-cargo-
            ${{ runner.os }}-cargo-
      - name: Validate moving-wall GPU parity
        run: cargo run -p aeroforge-gpu-smoke --bin aeroforge-gpu-smoke
      - name: Validate NEQ open-boundary GPU parity
        run: cargo run -p aeroforge-gpu-smoke --bin open_boundary
      - name: Validate free-stream far-field GPU parity
        run: cargo run -p aeroforge-gpu-smoke --bin far_field
