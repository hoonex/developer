name: Install Sloar Chat Coder

on:
  push:
    paths:
      - '.github/workflows/install-sloar.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch canonical Sloar
        run: |
          git clone --depth=1 https://github.com/hoonex/sloar-chat-coder.git /tmp/sloar-chat-coder

      - name: Install Sloar and bundled companions
        run: |
          python /tmp/sloar-chat-coder/.agents/skills/sloar-chat-coder/scripts/install.py --target "$GITHUB_WORKSPACE"

      - name: Remove one-shot installer workflow
        run: rm -f .github/workflows/install-sloar.yml

      - name: Commit installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No installation changes to commit."
            exit 0
          fi
          git commit -m "Install Sloar Chat Coder 0.9.0"
          git push origin HEAD:main
