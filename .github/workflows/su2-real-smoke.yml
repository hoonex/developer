name: AeroForge SU2 Runtime Acceptance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  AEROFORGE_SU2_RELEASE_SHA256: aadc800cd9df34deff99d4725f5897f620c9f2979f62ab235313311bf501f09b

jobs:
  su2-real-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-su2-real-cargo-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-su2-real-cargo-
            ${{ runner.os }}-cargo-
      - name: Cache pinned SU2 8.5.0 release archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/aeroforge-su2/v8.5.0
          key: su2-v8.5.0-linux64-omp-${{ env.AEROFORGE_SU2_RELEASE_SHA256 }}
      - name: Prepare pinned SU2 8.5.0 runtime and upstream fixture
        shell: bash
        run: |
          set -euo pipefail
          CACHE_ROOT="$HOME/.cache/aeroforge-su2/v8.5.0"
          OUTER_ZIP="$CACHE_ROOT/SU2-v8.5.0-linux64-omp.zip"
          ROOT="$RUNNER_TEMP/aeroforge-su2-acceptance"
          PKG="$ROOT/pkg"
          SU2_ROOT="$ROOT/su2"
          CASE="$ROOT/case"
          mkdir -p "$CACHE_ROOT"
          rm -rf "$ROOT"
          mkdir -p "$PKG" "$SU2_ROOT" "$CASE"

          download_su2() {
            curl -LfsS \
              https://github.com/su2code/SU2/releases/download/v8.5.0/SU2-v8.5.0-linux64-omp.zip \
              -o "$OUTER_ZIP"
          }
          if [[ ! -f "$OUTER_ZIP" ]]; then
            download_su2
          fi
          if ! echo "$AEROFORGE_SU2_RELEASE_SHA256  $OUTER_ZIP" | sha256sum -c -; then
            echo "Cached SU2 archive failed checksum; downloading one clean copy" >&2
            rm -f "$OUTER_ZIP"
            download_su2
            echo "$AEROFORGE_SU2_RELEASE_SHA256  $OUTER_ZIP" | sha256sum -c -
          fi
          unzip -q "$OUTER_ZIP" -d "$PKG"

          NESTED_SU2_ZIP="$(find "$PKG" -type f -name 'linux64-omp.zip' -print -quit)"
          if [[ -z "$NESTED_SU2_ZIP" ]]; then
            echo "Nested linux64-omp.zip not found after outer extraction" >&2
            find "$PKG" -maxdepth 3 -printf '%y %p -> %l\n' | head -200 >&2
            exit 1
          fi
          unzip -q "$NESTED_SU2_ZIP" -d "$SU2_ROOT"

          SU2_CFD="$(find "$SU2_ROOT" \( -type f -o -type l \) -name SU2_CFD -print -quit)"
          if [[ -z "$SU2_CFD" ]]; then
            echo "SU2_CFD not found after nested extraction" >&2
            find "$SU2_ROOT" -maxdepth 4 -printf '%y %p -> %l\n' | head -300 >&2
            exit 1
          fi
          SU2_CFD_RESOLVED="$(readlink -f "$SU2_CFD" || true)"
          if [[ -z "$SU2_CFD_RESOLVED" || ! -f "$SU2_CFD_RESOLVED" ]]; then
            echo "SU2_CFD entry did not resolve to a file: $(stat -c '%F %N' "$SU2_CFD")" >&2
            exit 1
          fi
          chmod +x "$SU2_CFD_RESOLVED"

          SU2_BANNER="$("$SU2_CFD" --help 2>&1 | grep -m1 'SU2 v' || true)"
          if [[ "$SU2_BANNER" != *"SU2 v8.5.0"* ]]; then
            echo "Expected SU2 v8.5.0 banner, got: ${SU2_BANNER:-<none>}" >&2
            exit 1
          fi
          echo "AEROFORGE_SU2_BINARY_ENTRY=$(stat -c '%F %N' "$SU2_CFD")"
          echo "AEROFORGE_SU2_BINARY_RESOLVED=$SU2_CFD_RESOLVED"
          echo "AEROFORGE_SU2_BANNER=$SU2_BANNER"

          curl -LfsS \
            https://raw.githubusercontent.com/su2code/SU2/12eb826f049ef7f67df974dfcb44cf36ee07c0f8/TestCases/incomp_navierstokes/cylinder/incomp_cylinder.cfg \
            -o "$CASE/incomp_cylinder.cfg"
          curl -LfsS \
            https://raw.githubusercontent.com/su2code/TestCases/790c80ec5b543487b5f8ecf8bb0f0e4d2cc67f3f/incomp_navierstokes/cylinder/mesh_cylinder_lam.su2 \
            -o "$CASE/mesh_cylinder_lam.su2"
          sed -i -E 's/^ITER=.*$/ITER= 11/' "$CASE/incomp_cylinder.cfg"
          grep -q '^ITER= 11$' "$CASE/incomp_cylinder.cfg"

          echo "SU2_RUN=$(dirname "$SU2_CFD")" >> "$GITHUB_ENV"
          echo "AEROFORGE_SU2_UPSTREAM_CASE_DIR=$CASE" >> "$GITHUB_ENV"
          echo "OMP_NUM_THREADS=1" >> "$GITHUB_ENV"
          echo "AEROFORGE_SU2_CONFIG_COMMIT=12eb826f049ef7f67df974dfcb44cf36ee07c0f8"
          echo "AEROFORGE_SU2_TESTCASES_COMMIT=790c80ec5b543487b5f8ecf8bb0f0e4d2cc67f3f"
      - name: Run AeroForge-generated SU2 8.5.0 cases
        run: cargo test -p aeroforge-accurate-backend --test su2_generated -- --ignored --nocapture
      - name: Run pinned upstream SU2 8.5.0 numerical regression
        run: cargo test -p aeroforge-accurate-backend --test su2_upstream upstream_inc_laminar_cylinder_matches_su2_850_regression -- --ignored --nocapture
