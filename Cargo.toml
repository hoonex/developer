[workspace]
members = [
    "crates/flow_core",
    "crates/accurate_backend",
    "crates/app",
    "crates/gpu_smoke",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
